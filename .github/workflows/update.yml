name: Update water data

on:
  schedule:
    - cron: "0 8 * * *"   # 3 AM Eastern in winter (4 AM in summer)
    - cron: "0 18 * * *"  # 1 PM Eastern in winter (2 PM in summer)
  workflow_dispatch:       # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect readings
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python collect.py
      - name: Save data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update water data"
          git push
