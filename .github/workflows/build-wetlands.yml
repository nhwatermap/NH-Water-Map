name: Build map layers

on:
  workflow_dispatch:       # only runs when you press "Run workflow"
    inputs:
      layer:
        description: "Which layer to build"
        type: choice
        options:
          - public lands
          - wetlands
          - both
        default: public lands

permissions:
  contents: write

concurrency:
  group: update-water-data   # waits for any water-data update in progress, so saves never collide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download wetlands
        if: inputs.layer == 'wetlands' || inputs.layer == 'both'
        run: python build_wetlands.py
      - name: Download public lands
        if: inputs.layer == 'public lands' || inputs.layer == 'both'
        run: python build_lands.py
      - name: Save the new layer files
        run: |
          mkdir -p /tmp/keep
          for d in wetlands lands; do
            if [ -f "$d/index.json" ]; then cp -r "$d" /tmp/keep/; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for d in wetlands lands; do
            if [ -d "/tmp/keep/$d" ]; then rm -rf "$d" && cp -r "/tmp/keep/$d" "$d"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in wetlands lands; do if [ -d "$d" ]; then git add -A "$d"; fi; done
          git diff --staged --quiet || git commit -m "Build map layers (${{ inputs.layer }})"
          git push origin HEAD:main
