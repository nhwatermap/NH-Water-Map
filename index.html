<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NH Water Conditions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎣</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eee8; --panel:#ffffff; --ink:#1c2822; --muted:#566860; --line:#cbd6ce; --accent:#2e5a4c;
  --fall2:#1d5ca6; --fall1:#72a6d8; --steady:#98a39d; --rise1:#e29a3f; --rise2:#bf3627;
  --t1:#2a5ea6; --t2:#4ea2c6; --t3:#5aa877; --t4:#dcae38; --t5:#cf512d;
  --lvl:#2e6e9e; --stale:#b9c2bc;
  --n1:#b2182b; --n2:#ef8a3c; --n3:#3fa34d; --n4:#5bc0de; --n5:#1f3fa8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --panel:#1a231f; --ink:#e3eae5; --muted:#9bb0a4; --line:#2c3a33; --accent:#8fc4b0;
    --steady:#7b8882; --stale:#4a5550; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --panel:#1a231f; --ink:#e3eae5; --muted:#9bb0a4; --line:#2c3a33; --accent:#8fc4b0;
  --steady:#7b8882; --stale:#4a5550; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;font-size:16px;line-height:1.4}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding:.7rem 1rem;background:var(--panel);
  border-bottom:1px solid var(--line);z-index:1000}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.45rem;margin:0;letter-spacing:.01em;color:var(--accent)}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.modes button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--ink);padding:.4rem .9rem;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.modes button:focus-visible,.refresh:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{margin-left:auto;display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.9rem}
.refresh{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:.3rem .7rem;cursor:pointer}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
.legend{position:absolute;left:.75rem;bottom:.75rem;z-index:500;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:.6rem .8rem;max-width:min(300px,calc(100% - 1.5rem));font-size:.88rem}
.legend strong{display:block;margin-bottom:.35rem}
.legend .row{display:flex;align-items:center;gap:.5rem;margin:.15rem 0}
.legend .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.legend p{margin:.4rem 0 0;color:var(--muted);font-size:.82rem}
.legend .shapes{border-top:1px solid var(--line);margin-top:.5rem;padding-top:.45rem}
.legend .shape{width:12px;height:12px;flex:none;border:2px solid var(--ink)}
.banner{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);z-index:600;background:var(--panel);
  border:1px solid var(--rise2);border-left-width:4px;border-radius:6px;padding:.6rem .9rem;max-width:min(560px,calc(100% - 1.5rem));
  font-size:.9rem;display:none;overflow-wrap:anywhere}
.banner.show{display:block}
.detail{position:absolute;right:.75rem;top:.75rem;bottom:.75rem;width:min(360px,calc(100% - 1.5rem));z-index:700;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;overflow-y:auto;display:none}
.detail.show{display:block}
.detail h2{font-size:1.15rem;margin:0 2rem .2rem 0;line-height:1.25}
.detail .sub{color:var(--muted);font-size:.85rem;margin:0 0 .8rem}
.close{position:absolute;top:.6rem;right:.6rem;border:0;background:transparent;color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer;padding:.2rem .4rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.stat{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
.stat span{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.15rem;font-weight:600}
.stat.wide{grid-column:1 / -1}
.stat small{display:block;color:var(--muted);font-size:.8rem;margin-top:.15rem}
.chart-wrap{overflow-x:auto}
.chart-title{font-weight:600;margin:.2rem 0 .3rem}
.detail a{color:var(--accent)}
.badge{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem;margin-bottom:.4rem;color:var(--muted)}
@media (max-width:640px){
  .detail{top:auto;left:.5rem;right:.5rem;width:auto;max-height:62%;bottom:.5rem}
  .legend{bottom:.5rem;left:.5rem}
  .status{width:100%;margin-left:0}
}
.leaflet-container{font-family:inherit}
</style>
</head>
<body>
<header>
  <h1>NH Water Conditions</h1>
  <div class="modes" role="group" aria-label="What to color the map by">
    <button data-mode="change" aria-pressed="true">24-hr change</button>
    <button data-mode="normal" aria-pressed="false">vs. normal</button>
    <button data-mode="level" aria-pressed="false">Water level</button>
    <button data-mode="temp" aria-pressed="false">Water temp</button>
  </div>
  <div class="status"><span id="status">Loading…</span></div>
</header>
<main>
  <div id="map"></div>
  <div class="banner" id="banner" role="alert"></div>
  <div class="legend" id="legend"></div>
  <aside class="detail" id="detail" aria-live="polite">
    <button class="close" id="close" aria-label="Close details">×</button>
    <div id="detailBody"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STALE_HOURS = 6; // readings older than this show as hollow circles (often ice)
let sites = [];
let collectedAt = Date.now(); // when the collector last ran
let mode = 'change';
const markers = L.layerGroup();

const map = L.map('map').setView([43.9, -71.55], 8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 17, attribution: 'Map: Esri, HERE, Garmin, USGS, NGA, EPA, NPS | Water data: USGS, US Army Corps of Engineers, NH DES'
}).addTo(map);
markers.addTo(map);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 1) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = t => t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const isStale = (s, key) => !s[key + 'Time'] || (collectedAt - new Date(s[key + 'Time'])) > STALE_HOURS * 3600e3;

function showError(msg) { const b = document.getElementById('banner'); b.textContent = msg; b.classList.add('show'); }

function colorFor(s) {
  if (mode === 'change') {
    const c = s.change;
    if (c == null) return null;
    if (c <= -0.5) return css('--fall2');
    if (c <= -0.1) return css('--fall1');
    if (c < 0.1) return css('--steady');
    if (c < 0.5) return css('--rise1');
    return css('--rise2');
  }
  if (mode === 'normal') {
    const c = s.normal && s.normal.cat;
    return c ? css({ 'much-below': '--n1', below: '--n2', normal: '--n3', above: '--n4', 'much-above': '--n5' }[c]) : null;
  }
  if (mode === 'temp') {
    const t = s.temp;
    if (t == null) return null;
    if (t < 40) return css('--t1');
    if (t < 50) return css('--t2');
    if (t < 60) return css('--t3');
    if (t < 70) return css('--t4');
    return css('--t5');
  }
  return s.height == null ? null : css('--lvl');
}

function tipText(s) {
  const head = esc(s.name) + '<br>';
  if (mode === 'change') return head + (s.change == null ? 'No 24-hr change available' : (s.change > 0 ? '+' : '') + fmt(s.change, 2) + ' ft in 24 hrs');
  if (mode === 'normal') return head + normalText(s);
  if (mode === 'temp') return head + fmt(s.temp) + ' °F water';
  return head + fmt(s.height, 2) + ' ft';
}

const CAT_LABEL = { 'much-below': 'Much below normal', below: 'Below normal', normal: 'Normal', above: 'Above normal', 'much-above': 'Much above normal' };
function ordinal(n) { const v = n % 100; return n + (['th', 'st', 'nd', 'rd'][(v - 20) % 10] || ['th', 'st', 'nd', 'rd'][v] || 'th'); }
function normalText(s) {
  if (!s.normal) return 'No history to compare';
  return CAT_LABEL[s.normal.cat] + ' for this date (' + ordinal(s.normal.pct) + ' percentile)';
}

function draw() {
  markers.clearLayers();
  const key = mode === 'temp' ? 'temp' : 'height';
  for (const s of sites) {
    const col = colorFor(s);
    if (!col) continue;
    const stale = isStale(s, key);
    const fill = stale ? 'transparent' : col, edge = stale ? css('--muted') : css('--ink');
    const corps = s.source === 'Army Corps', des = s.source === 'NHDES';
    const opts = { weight: stale ? 2 : 1, color: stale ? edge : 'rgba(0,0,0,.45)', fillColor: col, fillOpacity: stale ? 0 : .9 };
    const m = des
      ? L.marker([s.lat, s.lon], { icon: L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8],
          html: `<div style="width:14px;height:14px;border-radius:2px;background:${fill};border:2px solid ${edge}"></div>` }) })
      : corps
      ? L.marker([s.lat, s.lon], { icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9],
          html: `<div style="width:14px;height:14px;transform:rotate(45deg);background:${fill};border:2px solid ${edge}"></div>` }) })
      : L.circleMarker([s.lat, s.lon], { radius: 8, ...opts });
    const last = s[key + 'Time'];
    m.bindTooltip(stale ? esc(s.name) + '<br>No recent reading' + (last ? ' (last: ' + when(last) + ')' : '') : tipText(s));
    m.on('click', () => openDetail(s));
    m.addTo(markers);
  }
  drawLegend();
}

function drawLegend() {
  const rows = {
    change: [['--fall2', 'Falling fast (½ ft or more)'], ['--fall1', 'Falling'], ['--steady', 'Steady (within 0.1 ft)'], ['--rise1', 'Rising'], ['--rise2', 'Rising fast (½ ft or more)']],
    normal: [['--n5', 'Much above normal (top 10%)'], ['--n4', 'Above normal'], ['--n3', 'Normal (middle half)'], ['--n2', 'Below normal'], ['--n1', 'Much below normal (bottom 10%)']],
    temp: [['--t1', 'Below 40 °F'], ['--t2', '40–50 °F'], ['--t3', '50–60 °F'], ['--t4', '60–70 °F'], ['--t5', '70 °F and up']],
    level: [['--lvl', 'Reporting water level']]
  }[mode];
  const title = { normal: 'Compared to normal for this date', change: 'Water level change, last 24 hrs', temp: 'Water temperature', level: 'Water level' }[mode];
  const note = {
    change: 'Steady means it moved less than about an inch either way.',
    normal: 'Compares today with past years on the same date. USGS gauges use flow where they have it; Army Corps and NH DES stations use the last 10 years of levels.',
    temp: 'Only some stations measure water temperature.',
    level: 'Each station has its own zero point, so compare a spot to itself over time. Tap one for its 7-day chart.'
  }[mode];
  document.getElementById('legend').innerHTML = `<strong>${title}</strong>` +
    rows.map(([v, l]) => `<div class="row"><span class="dot" style="background:${css(v)}"></span>${l}</div>`).join('') + `<p>${note}</p>` +
    `<div class="shapes">
      <div class="row"><span class="shape" style="border-radius:50%"></span>USGS river gauge</div>
      <div class="row"><span class="shape" style="transform:rotate(45deg) scale(.85)"></span>Army Corps river or dam</div>
      <div class="row"><span class="shape" style="border-radius:2px"></span>NH DES lake or dam</div>
      <div class="row"><span class="shape" style="border-radius:50%;border-color:var(--muted);border-style:solid;background:transparent"></span>Hollow gray: no recent reading (often ice or sensor out for winter)</div>
    </div>`;
}

function chartSVG(series) {
  if (!series || series.length < 2) return '<p>Not enough readings for a chart.</p>';
  const W = 320, H = 150, P = 34;
  const xs = series.map(p => p[0] * 1000), ys = series.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 0.2) { const mid = (y0 + y1) / 2; y0 = mid - 0.1; y1 = mid + 0.1; }
  const X = t => P + (t - x0) / (x1 - x0 || 1) * (W - P - 6);
  const Y = v => 8 + (1 - (v - y0) / (y1 - y0)) * (H - 30);
  const line = series.map(p => X(p[0] * 1000).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  const ink = css('--muted'), acc = css('--accent');
  const day = d => new Date(d).toLocaleDateString(undefined, { weekday: 'short' });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Water level over the last 7 days">
    <line x1="${P}" y1="8" x2="${P}" y2="${H - 22}" stroke="${ink}" stroke-width=".5"/>
    <text x="${P - 4}" y="14" font-size="10" fill="${ink}" text-anchor="end">${y1.toFixed(1)}</text>
    <text x="${P - 4}" y="${H - 22}" font-size="10" fill="${ink}" text-anchor="end">${y0.toFixed(1)}</text>
    <polyline points="${line}" fill="none" stroke="${acc}" stroke-width="2" stroke-linejoin="round"/>
    <text x="${P}" y="${H - 6}" font-size="10" fill="${ink}">${day(x0)}</text>
    <text x="${W - 6}" y="${H - 6}" font-size="10" fill="${ink}" text-anchor="end">${day(x1)}</text></svg>`;
}

function openDetail(s) {
  const link = s.source === 'Army Corps'
    ? `https://water.usace.army.mil/overview/nae/locations/${encodeURIComponent(s.corpsId)}`
    : s.source === 'NHDES' ? 'https://nhdes.rtiamanzi.org/stations'
    : `https://waterdata.usgs.gov/monitoring-location/${encodeURIComponent(s.id)}/`;
  const siteName = { 'Army Corps': 'Army Corps', NHDES: 'NH DES', USGS: 'USGS' }[s.source] || s.source;
  const levelLabel = s.levelLabel || 'Water level';
  document.getElementById('detailBody').innerHTML = `<span class="badge">${esc(s.source)}</span>
    <h2>${esc(s.name || s.id)}</h2>
    <p class="sub">Last reading ${when(s.heightTime || s.flowTime || s.tempTime)}</p>
    <div class="stats">
      <div class="stat"><span>${esc(levelLabel)}</span><b>${s.height == null ? '—' : fmt(s.height, 2) + ' ft'}</b></div>
      <div class="stat"><span>24-hr change</span><b>${s.change == null ? '—' : (s.change > 0 ? '+' : '') + fmt(s.change, 2) + ' ft'}</b></div>
      <div class="stat"><span>Water temp</span><b>${s.temp == null ? 'Not measured' : fmt(s.temp) + ' °F'}</b></div>
      <div class="stat"><span>${esc(s.flowLabel || 'Flow')}</span><b>${s.flow == null ? '—' : Math.round(s.flow).toLocaleString() + ' cfs'}</b></div>
      <div class="stat wide"><span>Compared to normal for this date</span><b>${s.normal ? CAT_LABEL[s.normal.cat] : 'No history to compare'}</b>${s.normal ? `<small>Higher than ${s.normal.pct}% of past years on this date, based on ${s.normal.basis === 'flow' ? 'flow' : 'water level'} · ${esc(s.normal.source)}</small>` : ''}</div>
    </div>
    <div class="chart-title">${esc(levelLabel)}, last 7 days</div>
    <div class="chart-wrap">${chartSVG(s.series)}</div>
    <p><a href="${link}" target="_blank" rel="noopener">Open this station on the ${siteName} site</a></p>`;
  document.getElementById('detail').classList.add('show');
}

document.getElementById('close').onclick = () => document.getElementById('detail').classList.remove('show');
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b));
  draw();
});

fetch('data.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data.json not found yet'); return r.json(); })
  .then(d => {
    if (d.updated) collectedAt = +new Date(d.updated);
    sites = (d.sites || []).filter(s => s.lat != null && s.lon != null);
    draw();
    const count = src => sites.filter(s => s.source === src).length;
    document.getElementById('status').textContent = `${count('USGS')} USGS, ${count('Army Corps')} Army Corps, ${count('NHDES')} NH DES · updated ${when(d.updated)}`;
    if (!sites.length) showError('The last update found no stations. Check the Actions tab on GitHub for what went wrong.');
  })
  .catch(e => {
    document.getElementById('status').textContent = 'No data yet';
    showError('No readings yet. On GitHub, open the Actions tab and run “Update water data” once to create them.');
  });
</script>
</body>
</html>
